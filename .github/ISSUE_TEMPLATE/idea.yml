name: Suggest something
description: An idea, a feature you'd like, or something that could work better.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like AI Anti-Slop to do, or do differently?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it would help with
      description: The problem it solves, or the moment you wished it was there.
  - type: checkboxes
    id: help
    attributes:
      label: Building it
      options:
        - label: I'd like to work on this myself. CONTRIBUTING.md says how to start.
